name: Actualizar estado de directos

on:
  schedule:
    # Cada 5 minutos.
    - cron: "*/1 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-status-updater
  cancel-in-progress: true

jobs:
  update-live-status:
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizar estado de YouTube y Twitch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node update-live-status.mjs

      - name: Publicar cambios
        run: |
          if git diff --quiet -- live-status.json; then
            echo "No hay cambios de estado. No se hace commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live-status.json
          git commit -m "chore: actualizar estado de directos"
          git push
